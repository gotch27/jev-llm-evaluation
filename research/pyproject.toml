[project]
name = "thesis-research"
version = "0.1.0"
description = "Experiments comparing Jev and large language models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "thesis-datasets[images,parquet]",
    "thesis-model-clients",
    "python-dotenv>=1.1,<2",
    "rich>=14,<15",
    "typesafe-sdk>=0.7,<0.8",
]

[project.scripts]
thesis-research = "thesis_research.cli:main"

[tool.uv.sources]
thesis-datasets = { path = "../datasets", editable = true }
thesis-model-clients = { path = "../model-clients", editable = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
analysis = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_research"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/experiments", "/notebooks", "/README.md", "/CONFIGURATION.md",
    "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.env.example",
]
exclude = ["/data", "/outputs", "/models", "/.venv", "/dist", ".env"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
