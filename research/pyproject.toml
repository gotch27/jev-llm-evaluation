[project]
name = "thesis-research"
version = "0.1.0"
description = "Experiments comparing Jev and large language models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.13,<3",
    "openai>=3.16,<4",
    "pyarrow>=25,<26",
    "python-dotenv>=1.1,<2",
    "rich>=14,<15",
    "system-one-adapter[openai]>=0.2,<0.3",
    "typesafe-sdk>=0.7,<0.8",
]

[project.scripts]
thesis-research = "thesis_research.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
analysis = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_research"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
