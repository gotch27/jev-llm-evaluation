name = "BoolQ System One smoke"
baseline_model_id = "jev"
task_config = "../tasks/boolq.toml"

[cohort]
split = "train"
strategy = "stratified_random"
size = 2
seed = 20260920

[execution]
example_concurrency = 1
model_concurrency = 3

[[models]]
id = "jev"
backend = "system_one"
model = "typesafe-ai/jev"
provider = "typesafe-ai"

[[models]]
id = "laya"
backend = "system_one"
model = "convaiinnovations/laya"
provider = "boundless"

[[models]]
id = "liquid-d1"
backend = "system_one"
model = "liquid/d1"
provider = "liquid"

[[models]]
id = "gpt-6-luna-decisions"
backend = "system_one"
model = "openai/gpt-6-luna-decisions"
provider = "openai"
