[project]
name = "thesis-datasets"
version = "0.1.0"
description = "Shared, frozen datasets for thesis training and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=25,<26"]

[project.scripts]
thesis-datasets = "thesis_datasets.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_datasets"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
